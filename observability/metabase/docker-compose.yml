version: "3.8"

services:
  metabase:
    image: metabase/metabase:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_DB_PASSWORD}
      MB_DB_HOST: postgres
      MB_SITE_URL: https://${METABASE_DOMAIN}
      MB_SITE_NAME: ${MB_SITE_NAME:-Analytics}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - metabase-plugins:/plugins
    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metabase.rule=Host(`${METABASE_DOMAIN}`)"
      - "traefik.http.routers.metabase.entrypoints=websecure"
      - "traefik.http.routers.metabase.tls.certresolver=letsencrypt"
      - "traefik.http.services.metabase.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_DB_PASSWORD}
      POSTGRES_DB: metabase
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  metabase-plugins:
  postgres-data:

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
